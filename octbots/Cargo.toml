[package]
name = "octbots"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
log = "*"
rrplug = { workspace = true, features = ["async_engine"] }
shared = { workspace = true }
bspeater = { workspace = true, default-feautures = false }
parking_lot = "*"
once_cell = "*"
libc = "0.2.*"
oktree = { git = "https://github.com/catornot/oktree.git", default-features = false, features = ["bevy"] }
bonsai-bt = { version = "0.12.0", features = [] }
indexmap = "2.*"
rustc-hash = "2.*"
itertools = { workspace = true }
bevy_math = { version = "0.18.0", default-features = false, features = ["std"] }
flume = { version = "0.11.1", default-features = false }
rkyv = "=0.8.10"
parry3d = { version = "0.25.*", features = ["simd-stable"] }

[lib]
crate-type = ["cdylib"]

[features]
extra-debug = ["bonsai-bt/visualize"]
