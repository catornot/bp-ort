name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true

permissions:
  contents: write # Needed to write to GitHub draft release

jobs:
  build-northstar:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://attic.catornot.net/northstar https://nix-community.cachix.org
            extra-trusted-public-keys = northstar:H8QBUAeduEw6jGl3HtGeW/79pMPv7wSCAv8BSUon3kw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Get version
        id: version
        run: |
          echo "version=$(nix eval --raw .#version)" >> "$GITHUB_OUTPUT"

      - name: Validate tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match version v$VERSION"
            exit 1
          }

      - name: Build
        run: |
          nix build .#plugins

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp -rL result/bin/. dist/

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: bp_ort.release.v${{ steps.version.outputs.version }}
          path: ./dist

      - name: Upload files to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/**/*
          fail_on_unmatched_files: true
